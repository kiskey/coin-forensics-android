name: Android CI and Latest ARM APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.6.0"
  ANDROID_PLATFORM: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  verify:
    name: Test, lint, and verify ARM builds
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build ARM debug APKs
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify exactly arm64-v8a and armeabi-v7a
        run: ./scripts/verify-abi-apks.sh app/build/outputs/apk/debug dist

  release-latest:
    name: Publish rolling latest release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Build again in the write-enabled job rather than passing executable artifacts
      # from the read-only PR-capable job. This keeps the release boundary simple.
      - name: Rebuild verified ARM APKs
        run: |
          gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
          ./scripts/verify-abi-apks.sh app/build/outputs/apk/debug dist

      - name: Create release notes
        run: |
          cat > dist/RELEASE_NOTES.md <<NOTES
          Coin Forensics rolling Android build from commit ${GITHUB_SHA}.

          APKs included:
          - CoinForensics-arm64-v8a.apk — ARMv8 / 64-bit
          - CoinForensics-armeabi-v7a.apk — ARMv7 / 32-bit

          This workflow intentionally publishes no x86, x86_64, or universal APK.
          These are debug-signed CI builds intended for direct testing/sideloading.
          SHA-256 checksums are attached in SHA256SUMS.txt.
          NOTES

      - name: Replace rolling latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Keep one rolling release/tag named "latest". Existing assets are removed
          # by deleting and recreating this one release.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          gh release create latest \
            dist/CoinForensics-arm64-v8a.apk \
            dist/CoinForensics-armeabi-v7a.apk \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --latest \
            --title "Coin Forensics — Latest ARM Build" \
            --notes-file dist/RELEASE_NOTES.md
